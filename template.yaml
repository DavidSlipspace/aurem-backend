AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aurem backend - dev RDS database and Cognito auth

Parameters:
  DbName:
    Type: String
    Default: auremDev

  DbUsername:
    Type: String
    Default: postgres

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:
  AppDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: aurem-dev-db
      DBName: !Ref DbName
      Engine: postgres
      EngineVersion: "16.3"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      StorageEncrypted: true
      Tags:
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: Database
        - Key: Owner
          Value: David

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: aurem-dev-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: aurem-dev-frontend-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

Outputs:
  DatabaseEndpoint:
    Description: RDS database endpoint
    Value: !GetAtt AppDatabase.Endpoint.Address

  DatabaseName:
    Description: Database name
    Value: !Ref DbName

  DatabasePort:
    Description: Database port
    Value: !GetAtt AppDatabase.Endpoint.Port

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient