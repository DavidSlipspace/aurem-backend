          DUFFEL_ACCESS_TOKEN: !Ref DuffelAccessToken
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/flightProvider.ts
        Minify: false
        Target: es2022
        Sourcemap: true

  SearchTripFlightsFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - LambdaVpcEndpoint
    Properties:
      FunctionName: aurem-dev-search-trip-flights
      CodeUri: .
      Handler: searchTripFlights.handler
      Runtime: nodejs22.x
      Timeout: 35
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref ApplicationSecurityGroup
        SubnetIds:
          - !Ref SubnetIdA
          - !Ref SubnetIdB
      Environment:
        Variables:
          DB_HOST: !GetAtt AppDatabase.Endpoint.Address
          DB_PORT: !GetAtt AppDatabase.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_PASSWORD: !Ref DbPassword
          FLIGHT_PROVIDER_FUNCTION_NAME: !Ref FlightProviderFunction
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: InvokeFlightProvider
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt FlightProviderFunction.Arn
      Events:
        SearchTripFlightsApi:
          Type: Api
          Properties:
            RestApiId: !Ref AuremApi
            Path: /public/booking-links/{token}/flights/search
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/searchTripFlights.ts
        Minify: false
        Target: es2022
        Sourcemap: true
        External:
          - pg-native

Outputs:
  AdminInstanceId:
    Description: EC2 instance ID used for the SSM database tunnel.
    Value: !Ref AdminInstance

  DatabaseEndpoint:
    Description: Private RDS database endpoint.
    Value: !GetAtt AppDatabase.Endpoint.Address

  DatabaseName:
    Description: Database name.
    Value: !Ref DbName

  DatabasePort:
    Description: Database port.
    Value: !GetAtt AppDatabase.Endpoint.Port

  CognitoUserPoolId:
    Description: Cognito User Pool ID.
    Value: !Ref UserPool

  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID.
    Value: !Ref UserPoolClient

  ApiUrl:
    Description: API Gateway base URL.
    Value: !Sub "https://${AuremApi}.execute-api.${AWS::Region}.amazonaws.com/dev"

  GetCasesEndpoint:
    Description: GET /cases endpoint.
    Value: !Sub "https://${AuremApi}.execute-api.${AWS::Region}.amazonaws.com/dev/cases"

  LambdaVpcEndpointId:
    Description: Private interface endpoint used by VPC Lambdas to invoke AWS Lambda.
    Value: !Ref LambdaVpcEndpoint

  EmailServiceFunctionName:
    Description: Reusable non-VPC Lambda function that sends transactional email through Amazon SES.
    Value: !Ref EmailServiceFunction

  SaveTripSelectionsFunctionName:
    Description: Saves the GC selected flight and hotel to the trip.
    Value: !Ref SaveTripSelectionsFunction

  HotelProviderFunctionName:
    Description: Public Lambda that geocodes destinations and searches Duffel Stays.
    Value: !Ref HotelProviderFunction

  SearchTripHotelsFunctionName:
    Description: Private Lambda that validates booking links and initiates hotel searches.
    Value: !Ref SearchTripHotelsFunction

  FlightProviderFunctionName:
    Description: Public Lambda that resolves flight destinations and searches Duffel Flights.
    Value: !Ref FlightProviderFunction

  SearchTripFlightsFunctionName:
    Description: Private Lambda that validates booking links and initiates flight searches.
    Value: !Ref SearchTripFlightsFunction

  SsmVpcEndpointId:
    Description: Private interface endpoint used by the SSM administration instance.
    Value: !Ref SsmVpcEndpoint

  SesSenderEmail:
    Description: Amazon SES sender identity configured for trip emails.
    Value: !Ref SesSourceEmail

  FrontendBookingBaseUrl:
    Description: Frontend base URL used in GC booking emails.
    Value: !Ref FrontendBaseUrl