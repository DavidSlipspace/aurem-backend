AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Aurem backend - private RDS, Cognito, API Gateway, Lambda functions,
  SSM admin tunnel, private Lambda invocation, Amazon SES email delivery,
  and travel inventory search through Duffel and Mapbox.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC used by the Aurem development environment.

  SubnetIdA:
    Type: AWS::EC2::Subnet::Id
    Description: >
      First private application subnet used by Lambda, RDS, and the
      SSM administration instance.

  SubnetIdB:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Second private application subnet used by Lambda and RDS.
      It should be in a different Availability Zone from SubnetIdA.

  DbName:
    Type: String
    Default: auremDev
    Description: PostgreSQL database name.

  DbUsername:
    Type: String
    Default: postgres
    Description: PostgreSQL administrator username.

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: PostgreSQL administrator password.

  SesSourceEmail:
    Type: String
    Description: >
      Exact email address verified as an Amazon SES identity in the
      deployment region.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Enter a valid email address.

  FrontendBaseUrl:
    Type: String
    Default: http://localhost:5173
    Description: Base URL used to create secure GC booking links.

  DuffelAccessToken:
    Type: String
    NoEcho: true
    MinLength: 10
    Description: Duffel test or live access token used by travel provider functions.

  MapboxAccessToken:
    Type: String
    NoEcho: true
    MinLength: 10
    Description: Mapbox access token used to geocode trip destinations.

Resources:
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurem development application security group for Lambda functions and the SSM administration instance.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound database and HTTPS traffic.
      Tags:
        - Key: Name
          Value: aurem-dev-application-sg
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: Application

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurem development private PostgreSQL security group.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
          Description: Allow PostgreSQL connections from Aurem Lambda functions and the SSM administration instance.
      Tags:
        - Key: Name
          Value: aurem-dev-db-sg
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: Database

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows Aurem application resources to connect privately to AWS interface VPC endpoints.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
          Description: HTTPS from Aurem Lambda and administration resources.
      Tags:
        - Key: Name
          Value: aurem-dev-vpc-endpoints-sg
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: Networking

  LambdaVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref SubnetIdA
        - !Ref SubnetIdB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref SubnetIdA
        - !Ref SubnetIdB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SsmMessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref SubnetIdA
        - !Ref SubnetIdB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  Ec2MessagesVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref SubnetIdA
        - !Ref SubnetIdB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurem development database subnet group.
      SubnetIds:
        - !Ref SubnetIdA
        - !Ref SubnetIdB
      Tags:
        - Key: Name
          Value: aurem-dev-db-subnet-group
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: Database

  AppDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: aurem-dev-db
      DBName: !Ref DbName
      Engine: postgres
      EngineVersion: "16.3"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      BackupRetentionPeriod: 1
      DeletionProtection: false
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: aurem-dev-db
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: Database
        - Key: Owner
          Value: David

  AdminInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aurem-dev-admin-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: AdminTunnel

  AdminInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: aurem-dev-admin-instance-profile
      Roles:
        - !Ref AdminInstanceRole

  AdminInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - SsmVpcEndpoint
      - SsmMessagesVpcEndpoint
      - Ec2MessagesVpcEndpoint
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c02fb55956c7d316
      IamInstanceProfile: !Ref AdminInstanceProfile
      SubnetId: !Ref SubnetIdA
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      Tags:
        - Key: Name
          Value: aurem-dev-admin-ssm-instance
        - Key: Application
          Value: Aurem
        - Key: Environment
          Value: Dev
        - Key: Component
          Value: AdminTunnel

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: aurem-dev-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: aurem-dev-frontend-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  AuremApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: aurem-dev-api
      StageName: dev
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowOrigin: "'http://localhost:5173'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  ApiGatewayDefault4xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AuremApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'http://localhost:5173'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"

  ApiGatewayDefault5xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AuremApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'http://localhost:5173'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aurem-dev-get-me
      CodeUri: .
      Handler: getUser.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref ApplicationSecurityGroup
        SubnetIds:
          - !Ref SubnetIdA
          - !Ref SubnetIdB
      Environment:
        Variables:
          DB_HOST: !GetAtt AppDatabase.Endpoint.Address
          DB_PORT: !GetAtt AppDatabase.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_PASSWORD: !Ref DbPassword
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref AuremApi
            Path: /getUser
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/getUser.ts
        Minify: false
        Target: es2022
        Sourcemap: true
        External:
          - pg-native

