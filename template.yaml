AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Slipspace backend - database migration only

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  DatabaseMigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: slipspace-dev-db-migration
      CodeUri: src/
      Handler: db/migrate.handler
      Environment:
        Variables:
          DB_HOST: ""
          DB_PORT: "5432"
          DB_NAME: "slipspace_dev"
          DB_USER: ""
          DB_PASSWORD: ""
          DB_SSL: "true"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - db/migrate.ts
        Minify: false
        Target: es2022
        Sourcemap: true
        External:
          - pg-native